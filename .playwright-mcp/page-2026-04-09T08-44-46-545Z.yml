          - heading "À propos de Hedjav" [level=1] [ref=e19]
          - paragraph [ref=e20]: Hedjav, c'est l'expertise patrimoniale de Hermann D. AVAHOUIN au service des particuliers et entrepreneurs d'Afrique francophone.
        - generic [ref=e21]:
          - heading "L'histoire derrière Hedjav" [level=2] [ref=e22]
          - paragraph [ref=e23]:
            - text: "Hedjav est né d'un constat simple : en Afrique francophone, l'accès à un conseil patrimonial"
            - strong [ref=e24]: indépendant, compétent et adapté aux réalités locales
            - text: reste rare. Trop rare.
          - paragraph [ref=e25]: D'un côté, des banques qui vendent leurs propres produits. De l'autre, des contenus financiers occidentaux totalement déconnectés du contexte UEMOA. Au milieu, des cadres, entrepreneurs et familles qui veulent bâtir leur patrimoine sans savoir par où commencer.
          - paragraph [ref=e26]: Hedjav comble ce vide.
          - heading "Hermann D. AVAHOUIN — Le fondateur" [level=2] [ref=e27]
          - paragraph [ref=e28]:
            - strong [ref=e29]: 17 ans d'expérience dans la finance ouest-africaine.
          - paragraph [ref=e30]:
            - text: Analyste financier de formation, Hermann a passé plus d'une décennie au sein de
            - strong [ref=e31]: Bank of Africa Bénin (BOA)
            - text: ", où il a accompagné des centaines de clients sur des sujets de financement, d'investissement et de gestion de patrimoine."
          - paragraph [ref=e32]:
            - text: Aujourd'hui, à la tête de
            - strong [ref=e33]: KTALYZ Conseils
            - text: ", il met cette expertise au service direct des particuliers et entrepreneurs francophones, à travers du conseil patrimonial sur-mesure, des formations pratiques (BRVM, immobilier, structuration patrimoniale) et des publications accessibles."
          - heading "Notre vision" [level=2] [ref=e34]
          - blockquote [ref=e35]:
            - paragraph [ref=e36]: Démocratiser une expertise patrimoniale jusqu'ici réservée à une élite, en l'ancrant dans les réalités fiscales, économiques et culturelles du continent.
          - paragraph [ref=e37]: "Concrètement :"
