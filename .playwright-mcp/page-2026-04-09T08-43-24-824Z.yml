            - text: .
          - heading "6. Propriété intellectuelle" [level=2] [ref=e38]
          - paragraph [ref=e39]: Tous les contenus sont protégés par le droit d'auteur. L'achat confère un droit d'usage personnel et non cessible. Toute reproduction ou redistribution est interdite.
