          - heading "2. Produits" [level=2] [ref=e26]
          - paragraph [ref=e27]:
            - text: Les produits vendus sont des contenus numériques téléchargeables (ebooks au format PDF) et/ou des accès à des formations en ligne. Chaque produit est décrit sur sa page de vente avec son prix en
            - strong [ref=e28]: FCFA
            - text: .
          - heading "3. Prix et paiement" [level=2] [ref=e29]
          - paragraph [ref=e30]:
            - text: Les prix sont affichés en FCFA (Franc CFA — XOF). Le paiement s'effectue via
            - strong [ref=e31]: FedaPay
            - text: (Wave, Orange Money, MTN MoMo, carte bancaire). La commande est confirmée après réception du paiement.
          - heading "4. Livraison" [level=2] [ref=e32]
          - paragraph [ref=e33]: Après confirmation du paiement, le produit numérique est immédiatement accessible depuis l'espace membre du client sur hedjav.com. Un email de confirmation est envoyé à l'adresse fournie.
